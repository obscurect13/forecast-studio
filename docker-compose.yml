services:

  forecast:
    build: .
    container_name: forecast-studio
    ports:
      - "8000:8000"   # FastAPI
      - "8501:8501"   # Streamlit
    volumes:
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://localhost:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
